name: Dart Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mariadb:
    name: MariaDB ${{ matrix.mariadb-version }} (${{ matrix.sdk }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.6.0]
        mariadb-version: ['10.11', '11.8']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SSL certificates
        run: .github/scripts/generate-test-certs.sh

      - name: Create MariaDB SSL config file
        run: |
          echo "[mysqld]" > my.cnf
          echo "ssl_ca=/etc/mysql/certs/ca-cert.pem" >> my.cnf
          echo "ssl_cert=/etc/mysql/certs/server-cert.pem" >> my.cnf
          echo "ssl_key=/etc/mysql/certs/server-key.pem" >> my.cnf
          echo "bind-address=0.0.0.0" >> my.cnf

      - name: Copy SSL certificates to MariaDB directory
        run: |
          sudo mkdir -p /etc/mysql/certs
          sudo cp certs/ca-cert.pem /etc/mysql/certs/
          sudo cp certs/server-cert.pem /etc/mysql/certs/
          sudo cp certs/server-key.pem /etc/mysql/certs/
          sudo chown mysql:mysql /etc/mysql/certs/ca-cert.pem /etc/mysql/certs/server-cert.pem /etc/mysql/certs/server-key.pem
          sudo chmod 644 /etc/mysql/certs/ca-cert.pem /etc/mysql/certs/server-cert.pem
          sudo chmod 600 /etc/mysql/certs/server-key.pem

      - name: Setup MariaDB
        uses: ankane/setup-mariadb@v1
        with:
          mariadb-version: ${{ matrix.mariadb-version }}
          database: banco_teste

      - name: Configure MariaDB for SSL
        run: |
          sudo cp my.cnf /etc/mysql/mariadb.conf.d/ssl.cnf
          sudo chown mysql:mysql /etc/mysql/mariadb.conf.d/ssl.cnf
          sudo systemctl restart mariadb

      - name: Verify MariaDB installation
        run: |
          mysql --version
          mysql -u root -e 'SELECT VERSION()'
          mysql -u root -e 'SHOW VARIABLES LIKE "have_ssl"'

      - name: Configure test user
        run: |
          mysql -u root -e "CREATE USER IF NOT EXISTS 'dart'@'%' IDENTIFIED BY 'dart';"
          mysql -u root -e "GRANT ALL PRIVILEGES ON *.* TO 'dart'@'%' WITH GRANT OPTION;"
          mysql -u root -e "FLUSH PRIVILEGES;"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart tests on MariaDB ${{ matrix.mariadb-version }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: dart
          MYSQL_PASSWORD: dart
          MYSQL_DATABASE: banco_teste
          MYSQL_SECURE: "true"
          MYSQL_CA_CERT: certs/ca-cert.pem
        run: dart run test --concurrency 1 --chain-stack-traces --platform vm

      # Separate from the suite: restarts the database server for real.
      - name: Server restart test on MariaDB ${{ matrix.mariadb-version }}
        if: ${{ !cancelled() }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: dart
          MYSQL_PASSWORD: dart
          MYSQL_DATABASE: banco_teste
          MYSQL_SECURE: "true"
          MYSQL_CA_CERT: certs/ca-cert.pem
          MYSQL_RESTART_COMMAND: sudo systemctl restart mariadb
        run: dart run test test/pool_test.dart --plain-name "recupera após reinício real" --chain-stack-traces --platform vm

  mysql:
    name: MySQL ${{ matrix.mysql-version }} (${{ matrix.sdk }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.6.0]
        mysql-version: ['5.6', '5.7', '9', '9.7']
        include:
          # 5.x defaults to latin1 and a 4 MB packet; the suite expects utf8mb4 and 64 MB.
          - mysql-version: '5.6'
            server-args: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-allowed-packet=64M
          - mysql-version: '5.7'
            server-args: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-allowed-packet=64M

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SSL certificates
        run: .github/scripts/generate-test-certs.sh

      # Started here rather than as a service: the server needs the
      # certificates generated above, signed by the CA the tests trust.
      - name: Start MySQL ${{ matrix.mysql-version }} with TLS
        run: |
          chmod 644 certs/*.pem
          docker run -d --name mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=dart \
            -e MYSQL_DATABASE=banco_teste \
            -e MYSQL_USER=dart \
            -e MYSQL_PASSWORD=dart \
            -v "$PWD/certs:/etc/mysql/certs:ro" \
            mysql:${{ matrix.mysql-version }} \
            --ssl-ca=/etc/mysql/certs/ca-cert.pem \
            --ssl-cert=/etc/mysql/certs/server-cert.pem \
            --ssl-key=/etc/mysql/certs/server-key.pem \
            ${{ matrix.server-args }}
          # The entrypoint's first start skips TCP; this waits for the real one.
          for i in $(seq 1 90); do
            if docker exec mysql mysql -h127.0.0.1 -udart -pdart -e 'SELECT 1' >/dev/null 2>&1; then
              docker exec mysql mysql -h127.0.0.1 -udart -pdart -e "SELECT VERSION(); SHOW STATUS LIKE 'Ssl_cipher'"
              exit 0
            fi
            sleep 2
          done
          docker logs mysql
          exit 1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart tests on MySQL ${{ matrix.mysql-version }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: dart
          MYSQL_PASSWORD: dart
          MYSQL_DATABASE: banco_teste
          MYSQL_SECURE: "true"
          MYSQL_CA_CERT: certs/ca-cert.pem
        run: dart run test --concurrency 1 --chain-stack-traces --platform vm

      # Separate from the suite: restarts the database server for real.
      - name: Server restart test on MySQL ${{ matrix.mysql-version }}
        if: ${{ !cancelled() }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: dart
          MYSQL_PASSWORD: dart
          MYSQL_DATABASE: banco_teste
          MYSQL_SECURE: "true"
          MYSQL_CA_CERT: certs/ca-cert.pem
          MYSQL_RESTART_COMMAND: docker restart mysql
        run: dart run test test/pool_test.dart --plain-name "recupera após reinício real" --chain-stack-traces --platform vm

  windows:
    name: Windows MySQL ${{ matrix.mysql-version }} (${{ matrix.sdk }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.6.0]
        mysql-version: ['8.4', '9.7']
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The action enables TLS with its own CA; the server certificate names
      # localhost and 127.0.0.1, so the tests trust var/ca.pem.
      - name: Setup MySQL ${{ matrix.mysql-version }}
        id: setup-mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: ${{ matrix.mysql-version }}

      - name: Configure test database and user
        run: |
          mysql -uroot -h127.0.0.1 -e "CREATE DATABASE IF NOT EXISTS banco_teste;"
          mysql -uroot -h127.0.0.1 -e "CREATE USER IF NOT EXISTS 'dart'@'%' IDENTIFIED BY 'dart';"
          mysql -uroot -h127.0.0.1 -e "GRANT ALL PRIVILEGES ON *.* TO 'dart'@'%' WITH GRANT OPTION;"
          mysql -uroot -h127.0.0.1 -e "SELECT VERSION(); SHOW STATUS LIKE 'Ssl_cipher';"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart tests on Windows MySQL ${{ matrix.mysql-version }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: dart
          MYSQL_PASSWORD: dart
          MYSQL_DATABASE: banco_teste
          MYSQL_SECURE: "true"
          MYSQL_CA_CERT: ${{ steps.setup-mysql.outputs.base-dir }}/var/ca.pem
        run: dart run test --concurrency 1 --chain-stack-traces --platform vm
